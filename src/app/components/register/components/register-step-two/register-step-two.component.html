<form [formGroup]="formUsuario" (ngSubmit)="onSalvar()">
  <img [src]="imagePreview" alt="avatar" (click)="triggerFileInput()" />

  <input
    type="file"
    accept="image/*"
    (change)="onFileSelected($event)"
    hidden
    #fileInput
  />

  <mat-form-field appearance="fill">
    <mat-label>Nome</mat-label>
    <input matInput formControlName="nome" required>
    <mat-error *ngIf="formUsuario.get('nome')?.invalid && formUsuario.get('nome')?.touched">
      Nome é obrigatório!
    </mat-error>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit"
   [disabled]="formUsuario.invalid">Salvar</button>
</form>
